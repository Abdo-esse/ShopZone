services:
  # =====================
  # KAFKA
  # =====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  
  # =====================
  # KAFKA UI
  # =====================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # =====================
  # KAFKA INIT (Create Topics)
  # =====================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/init-kafka-topics.sh:/scripts/init-kafka-topics.sh
    entrypoint: ["/bin/bash", "/scripts/init-kafka-topics.sh"]
    restart: "no"


  # =====================
  # REDIS
  # =====================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # =====================
  # MINIO
  # =====================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # =====================
  # DATABASES
  # =====================
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user"]
      interval: 10s
      timeout: 5s
      retries: 5


  catalog-db:
    image: postgres:16
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_pass
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  store-db:
    image: postgres:16
    environment:
      POSTGRES_DB: store_db
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: store_pass
    volumes:
      - store-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =====================
  # API GATEWAY
  # =====================
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: --max-old-space-size=4096

  # =====================
  # MICROSERVICES
  # =====================
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-db:
        condition: service_started
    environment:
      DATABASE_URL: postgres://auth_user:auth_pass@auth-db:5432/auth_db
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: --max-old-space-size=4096

  catalog-service:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      catalog-db:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: --max-old-space-size=4096

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      order-db:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: --max-old-space-size=4096

  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      inventory-db:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: --max-old-space-size=4096

  store-service:
    build:
      context: .
      dockerfile: apps/store-service/Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      store-db:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: --max-old-space-size=4096

volumes:
  redis-data:
  minio-data:
  auth-db-data:
  catalog-db-data:
  order-db-data:
  inventory-db-data:
  store-db-data:
